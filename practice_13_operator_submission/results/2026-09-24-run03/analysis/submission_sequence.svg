<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 630" role="img" aria-label="算子提交机制示意，非比例时间线"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#087d75"/></marker></defs><rect width="1150" height="630" fill="white"/><rect x="25" y="10" width="230" height="42" rx="5" fill="#e7f2ef"/><text x="140" y="37" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17404a">CPU主线程</text><line x1="140" x2="140" y1="55" y2="605" stroke="#a4bdb6" stroke-dasharray="5 5"/><rect x="295" y="10" width="230" height="42" rx="5" fill="#e7f2ef"/><text x="410" y="37" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17404a">主机任务队列</text><line x1="410" x2="410" y1="55" y2="605" stroke="#a4bdb6" stroke-dasharray="5 5"/><rect x="585" y="10" width="230" height="42" rx="5" fill="#e7f2ef"/><text x="700" y="37" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17404a">CPU下发线程 / CANN</text><line x1="700" x2="700" y1="55" y2="605" stroke="#a4bdb6" stroke-dasharray="5 5"/><rect x="895" y="10" width="230" height="42" rx="5" fill="#e7f2ef"/><text x="1010" y="37" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#17404a">NPU stream</text><line x1="1010" x2="1010" y1="55" y2="605" stroke="#a4bdb6" stroke-dasharray="5 5"/><rect x="45" y="70" width="810" height="48" rx="4" fill="#fff1d9"/><text x="70" y="91" font-size="15" fill="#17404a">启动 / 预热：Triton编译 → 二进制与函数注册</text><text x="70" y="110" font-size="13" fill="#526c70">内部代码传输的精确时刻未直接观测</text><line x1="140" x2="410" y1="155" y2="155" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">输入数据拷贝入队</text><line x1="410" x2="700" y1="200" y2="200" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="190" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">出队</text><line x1="700" x2="1010" y1="245" y2="245" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="855" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">提交H2D</text><line x1="140" x2="410" y1="295" y2="295" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">句柄、地址、标量、grid、stream</text><line x1="410" x2="700" y1="340" y2="340" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">出队，准备原生参数包</text><line x1="700" x2="1010" y1="385" y2="385" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="855" y="375" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">runtime launch</text><line x1="140" x2="410" y1="485" y2="485" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="275" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">采样后：D2H + event</text><line x1="410" x2="700" y1="530" y2="530" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="555" y="520" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">出队</text><line x1="700" x2="1010" y1="575" y2="575" stroke="#087d75" stroke-width="2" marker-end="url(#arrow)"/><text x="855" y="565" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#17404a">D2H + event</text><rect x="38" y="410" width="255" height="34" rx="4" fill="#fff1d9"/><text x="50" y="432" font-size="14" fill="#17404a">CPU继续后续操作（实际有重叠）</text><rect x="900" y="410" width="210" height="34" rx="4" fill="#e7f2ef"/><text x="920" y="432" font-size="14" fill="#17404a">NPU执行已提交任务</text><text x="45" y="615" font-size="14" fill="#17404a">CPU在原生event等待返回后读取结果；本图表示机制，间隔不代表测量值。</text></svg>