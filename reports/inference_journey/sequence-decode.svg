<svg xmlns="http://www.w3.org/2000/svg" width="900" height="794" viewBox="0 0 900 794" role="img">
<title>decode 请求时序 / 教学摘要</title>
<desc>来自独立实验和归档源码的教学整理，不按真实时间缩放。泳道按职责划分；HBM 是存储。</desc>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif}</style>
<rect width="900" height="794" fill="white"/><rect width="900" height="75" fill="#f1f5f2"/>
<defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687d88" stroke="#687d88"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3267b1" stroke="#3267b1"/></marker>
<marker id="command" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#ab6019"/></marker>
<marker id="compute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087d78" stroke="#087d78"/></marker>
</defs>
<text x="75" y="30" text-anchor="middle" font-size="12" fill="#284650">客户端 / API</text><line x1="75" x2="75" y1="60" y2="729" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="223" y="30" text-anchor="middle" font-size="12" fill="#284650">Scheduler</text><line x1="223" x2="223" y1="60" y2="729" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="371" y="30" text-anchor="middle" font-size="12" fill="#284650">Runner / PyTorch</text><line x1="371" x2="371" y1="60" y2="729" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="519" y="30" text-anchor="middle" font-size="12" fill="#284650">CANN / 队列</text><line x1="519" x2="519" y1="60" y2="729" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="667" y="30" text-anchor="middle" font-size="12" fill="#284650">NPU stream</text><line x1="667" x2="667" y1="60" y2="729" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="815" y="30" text-anchor="middle" font-size="12" fill="#284650">HBM 存储</text><line x1="815" x2="815" y1="60" y2="729" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="17" y="114" font-size="11" fill="#547078">01</text><text x="297.0" y="99" text-anchor="middle" font-size="12" fill="#294551">调度 t₀：本轮只处理位置 126</text><path d="M223,115H371" fill="none" stroke="#687d88" stroke-width="1.8"  marker-end="url(#control)"/>
<text x="17" y="173" font-size="11" fill="#547078">02</text><text x="593.0" y="158" text-anchor="middle" font-size="12" fill="#294551">准备单 token 输入、位置和 metadata</text><path d="M371,174H815" fill="none" stroke="#3267b1" stroke-width="1.8"  marker-end="url(#data)"/>
<text x="17" y="232" font-size="11" fill="#547078">03</text><text x="445.0" y="217" text-anchor="middle" font-size="12" fill="#294551">普通分区：ACL graph replay</text><path d="M371,233H519" fill="none" stroke="#ab6019" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#command)"/>
<text x="17" y="291" font-size="11" fill="#547078">04</text><text x="593.0" y="276" text-anchor="middle" font-size="12" fill="#294551">提交图执行与 attention 设备任务</text><path d="M519,292H667" fill="none" stroke="#ab6019" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#command)"/>
<text x="17" y="350" font-size="11" fill="#547078">05</text><text x="741.0" y="335" text-anchor="middle" font-size="12" fill="#294551">对 t₀ 计算 Q/K/V 与 RoPE</text><path d="M667,351H815" fill="none" stroke="#087d78" stroke-width="1.8"  marker-end="url(#compute)"/>
<text x="17" y="409" font-size="11" fill="#547078">06</text><text x="741.0" y="394" text-anchor="middle" font-size="12" fill="#294551">将 t₀ 的新 K/V 写入 cache</text><path d="M667,410H815" fill="none" stroke="#087d78" stroke-width="1.8"  marker-end="url(#compute)"/>
<text x="17" y="468" font-size="11" fill="#547078">07</text><text x="741.0" y="453" text-anchor="middle" font-size="12" fill="#294551">FIA：新 Q 读取历史 + 当前 KV</text><path d="M815,469H667" fill="none" stroke="#3267b1" stroke-width="1.8"  marker-end="url(#data)"/>
<text x="17" y="527" font-size="11" fill="#547078">08</text><text x="741.0" y="512" text-anchor="middle" font-size="12" fill="#294551">Attention 写 output；下一分区消费</text><path d="M667,528H815" fill="none" stroke="#087d78" stroke-width="1.8"  marker-end="url(#compute)"/>
<text x="17" y="586" font-size="11" fill="#547078">09</text><text x="741.0" y="571" text-anchor="middle" font-size="12" fill="#294551">24 层结束；LM head 与采样生成 t₁</text><path d="M667,587H815" fill="none" stroke="#087d78" stroke-width="1.8"  marker-end="url(#compute)"/>
<text x="17" y="645" font-size="11" fill="#547078">10</text><text x="593.0" y="630" text-anchor="middle" font-size="12" fill="#294551">D2H：取得 t₁ 的 ID</text><path d="M815,646H371" fill="none" stroke="#3267b1" stroke-width="1.8"  marker-end="url(#data)"/>
<text x="17" y="704" font-size="11" fill="#547078">11</text><text x="297.0" y="689" text-anchor="middle" font-size="12" fill="#294551">达到输出长度：computed=127，output=2</text><path d="M371,705H223" fill="none" stroke="#687d88" stroke-width="1.8"  marker-end="url(#control)"/>
<text x="20" y="769" font-size="11" fill="#547078">decode · 教学时序，不按时间比例。灰：控制；蓝：数据；橙色虚线：异步命令；绿：设备工作。</text></svg>
