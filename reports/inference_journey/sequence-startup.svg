<svg xmlns="http://www.w3.org/2000/svg" width="900" height="499" viewBox="0 0 900 499" role="img">
<title>startup 请求时序 / 教学摘要</title>
<desc>来自独立实验和归档源码的教学整理，不按真实时间缩放。泳道按职责划分；HBM 是存储。</desc>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif}</style>
<rect width="900" height="499" fill="white"/><rect width="900" height="75" fill="#f1f5f2"/>
<defs>
<marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687d88" stroke="#687d88"/></marker>
<marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3267b1" stroke="#3267b1"/></marker>
<marker id="command" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#ab6019"/></marker>
<marker id="compute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087d78" stroke="#087d78"/></marker>
</defs>
<text x="75" y="30" text-anchor="middle" font-size="12" fill="#284650">客户端 / API</text><line x1="75" x2="75" y1="60" y2="434" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="223" y="30" text-anchor="middle" font-size="12" fill="#284650">Scheduler</text><line x1="223" x2="223" y1="60" y2="434" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="371" y="30" text-anchor="middle" font-size="12" fill="#284650">Runner / PyTorch</text><line x1="371" x2="371" y1="60" y2="434" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="519" y="30" text-anchor="middle" font-size="12" fill="#284650">CANN / 队列</text><line x1="519" x2="519" y1="60" y2="434" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="667" y="30" text-anchor="middle" font-size="12" fill="#284650">NPU stream</text><line x1="667" x2="667" y1="60" y2="434" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="815" y="30" text-anchor="middle" font-size="12" fill="#284650">HBM 存储</text><line x1="815" x2="815" y1="60" y2="434" stroke="#bacbc7" stroke-dasharray="4 5"/>
<text x="17" y="114" font-size="11" fill="#547078">01</text><text x="223.0" y="99" text-anchor="middle" font-size="12" fill="#294551">启动服务：加载本地模型与配置</text><path d="M75,115H371" fill="none" stroke="#687d88" stroke-width="1.8"  marker-end="url(#control)"/>
<text x="17" y="173" font-size="11" fill="#547078">02</text><text x="593.0" y="158" text-anchor="middle" font-size="12" fill="#294551">权重驻留 NPU；建立 KV 存储池</text><path d="M371,174H815" fill="none" stroke="#3267b1" stroke-width="1.8"  marker-end="url(#data)"/>
<text x="17" y="232" font-size="11" fill="#547078">03</text><text x="385" y="217" text-anchor="start" font-size="12" fill="#294551">TorchDynamo 捕获模型 FX 图</text><path d="M371,223h55v18h-55" fill="none" stroke="#687d88" stroke-width="1.8"  marker-end="url(#control)"/>
<text x="17" y="291" font-size="11" fill="#547078">04</text><text x="445.0" y="276" text-anchor="middle" font-size="12" fill="#294551">49 个分区；为尺寸 1 捕获设备图</text><path d="M371,292H519" fill="none" stroke="#ab6019" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#command)"/>
<text x="17" y="350" font-size="11" fill="#547078">05</text><text x="593.0" y="335" text-anchor="middle" font-size="12" fill="#294551">预热并执行捕获所需的设备工作</text><path d="M519,351H667" fill="none" stroke="#ab6019" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#command)"/>
<text x="17" y="409" font-size="11" fill="#547078">06</text><text x="223.0" y="394" text-anchor="middle" font-size="12" fill="#294551">服务就绪，开始正式请求</text><path d="M371,410H75" fill="none" stroke="#687d88" stroke-width="1.8"  marker-end="url(#control)"/>
<text x="20" y="474" font-size="11" fill="#547078">startup · 教学时序，不按时间比例。灰：控制；蓝：数据；橙色虚线：异步命令；绿：设备工作。</text></svg>
